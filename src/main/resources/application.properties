spring.application.name=SoulSync

# ---------------------------------
# POSTGRESQL DATABASE CONFIG
# ---------------------------------

# The database URL.
# Format: jdbc:postgresql://<host>:<port>/<database_name>
# Default port is 5432.
spring.datasource.url=jdbc:postgresql://localhost:5432/soulsyncdb

# Your database username and password
spring.datasource.username=soulsync_user
spring.datasource.password=saxenaashu630

# ---------------------------------
# (OPTIONAL) JPA & HIBERNATE SETTINGS
# ---------------------------------

# This tells Hibernate what to do with your schema (tables) when the app starts.
# - 'none': (Default for prod) Does nothing.
# - 'validate': Checks if the schema matches your @Entity classes. Fails on mismatch.
# - 'update': (Good for dev) Tries to automatically add/change columns.
# - 'create-drop': (Good for tests) Creates all tables on start, drops them on exit.
spring.jpa.hibernate.ddl-auto=update

# (Optional) This shows you the actual SQL queries Hibernate runs in your console.
# Very useful for debugging.
spring.jpa.show-sql=true

# (Optional) Makes the SQL from 'show-sql' easier to read.
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.sql.init.separator=;;
spring.jpa.defer-datasource-initialization=true
